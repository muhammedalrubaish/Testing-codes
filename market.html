<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>السوق | منصة صافي</title>
  <meta name="description" content="تصفّح الأجهزة الإلكترونية وقارن الأسعار بين متاجر التجزئة وموردي الجملة على منصة صافي." />
  <meta name="theme-color" content="#1463f3" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <img src="assets/img/favicon.svg" alt="شعار صافي" class="brand-icon" />
        <span>صافي<small>سوق الإلكترونيات المتكامل</small></span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html">الرئيسية</a>
        <a href="market.html" class="active">السوق</a>
        <a href="index.html#how">كيف تعمل المنصة</a>
        <a href="index.html#plans">الباقات</a>
        <a href="join.html">انضم إلينا</a>
      </nav>
      <div class="header-actions">
        <a href="join.html" class="btn btn-outline btn-sm">تسجيل الدخول</a>
        <a href="join.html" class="btn btn-primary btn-sm">انضم الآن</a>
        <button class="nav-toggle" aria-label="فتح القائمة">☰</button>
      </div>
    </div>
  </header>

  <section class="market-hero">
    <div class="container">
      <h1>سوق صافي للإلكترونيات</h1>
      <p>ابحث، قارن الأسعار بين المتاجر والموردين، واشترِ بأفضل عرض.</p>
    </div>
  </section>

  <div class="container">
    <div class="market-toolbar">
      <input type="search" id="searchInput" placeholder="🔍 ابحث عن جهاز… (مثال: آيفون، سماعة، لابتوب)" />
      <select id="categoryFilter">
        <option value="">كل التصنيفات</option>
      </select>
      <select id="sortSelect">
        <option value="default">ترتيب افتراضي</option>
        <option value="priceAsc">السعر: من الأقل للأعلى</option>
        <option value="priceDesc">السعر: من الأعلى للأقل</option>
      </select>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="retail">🛒 أسعار التجزئة (للعملاء)</button>
      <button class="mode-tab" data-mode="wholesale">🏭 أسعار الجملة (للتجار)</button>
    </div>
    <p class="market-note" id="marketNote">تعرض الأسعار أدناه أفضل عروض متاجر التجزئة للعملاء النهائيين.</p>

    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- نافذة مقارنة الأسعار -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div class="m-thumb" id="modalThumb">📱</div>
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose" aria-label="إغلاق">✕</button>
      </div>
      <div class="modal-body">
        <p class="hint" id="modalHint"></p>
        <div id="modalOffers"></div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">© 2026 منصة صافي — جميع الحقوق محفوظة</div>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
